<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0">
<div class="cc-surface" style="padding: 28px 28px 36px; background: var(--paper); color: var(--ink)">
<div class="cc-band-paper" style="padding:40px 24px 44px; margin:-28px -28px -36px">
  <div style="position:relative; display:flex; flex-wrap:wrap; gap:36px; padding-top:24px">
    <div class="cc-thread" aria-hidden="true" style="position:absolute; left:6%; right:6%; top:21px"></div>
    <div class="cc-exhibit" style="flex:1 1 220px; transform:rotate(-1.2deg)"><span class="cc-pin" aria-hidden="true"></span><div style="display:flex; align-items:center; gap:12px"><span class="cc-keycap">1</span><span class="cc-eyebrow">EXHIBIT A</span></div><h3 class="cc-title">Read the statements.</h3></div>
    <div class="cc-exhibit" style="flex:1 1 220px; transform:rotate(1deg)"><span class="cc-pin" aria-hidden="true"></span><div style="display:flex; align-items:center; gap:12px"><span class="cc-keycap">2</span><span class="cc-eyebrow">EXHIBIT B</span></div><h3 class="cc-title">Look behind the page.</h3></div>
    <div class="cc-exhibit" style="flex:1 1 220px; transform:rotate(-0.8deg)"><span class="cc-pin" aria-hidden="true"></span><div style="display:flex; align-items:center; gap:12px"><span class="cc-keycap">3</span><span class="cc-eyebrow">EXHIBIT C</span></div><h3 class="cc-title">Make your accusation.</h3><span class="cc-stamp" style="align-self:flex-end">CASE CLOSED</span></div>
  </div>
</div>
</div>
</body>
</html>
